<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 140" width="100%" height="100%">
  <defs>
    <!-- Card Back Gradient -->
    <linearGradient id="cardBackGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0052FF" />
      <stop offset="100%" stop-color="#00C6FF" />
    </linearGradient>

    <!-- Card Top Gradient -->
    <linearGradient id="cardTopGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#F0F7FF" />
    </linearGradient>

    <!-- Swoosh Orbit Gradient -->
    <linearGradient id="swooshGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0052FF" />
      <stop offset="50%" stop-color="#00B2FF" />
      <stop offset="100%" stop-color="#00E5FF" />
    </linearGradient>

    <!-- Text Builder Gradient -->
    <linearGradient id="builderTextGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0066FF" />
      <stop offset="100%" stop-color="#00D2FF" />
    </linearGradient>

    <!-- Drop Shadows -->
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#0033aa" flood-opacity="0.2" />
    </filter>
  </defs>

  <!-- ICON GROUP -->
  <g transform="translate(10, 8)">
    <!-- Back Blue Card -->
    <rect x="22" y="24" width="60" height="80" rx="9" transform="rotate(-12 52 64)" fill="url(#cardBackGrad)" opacity="0.95" />

    <!-- Middle Blue Card -->
    <rect x="28" y="20" width="60" height="80" rx="9" transform="rotate(-5 58 60)" fill="#0066FF" opacity="0.9" />

    <!-- Front White Resume Card -->
    <g filter="url(#shadow)">
      <rect x="34" y="14" width="62" height="84" rx="9" fill="url(#cardTopGrad)" stroke="#E2E8F0" stroke-width="1.5" />
      
      <!-- Avatar Head & Shoulders -->
      <circle cx="52" cy="33" r="6.5" fill="#0052FF" />
      <path d="M 42 49 C 42 42, 62 42, 62 49 Z" fill="#0052FF" />

      <!-- Document Lines -->
      <rect x="62" y="27" width="26" height="3.5" rx="1.5" fill="#0066FF" opacity="0.85" />
      <rect x="62" y="33" width="22" height="3" rx="1.5" fill="#94A3B8" />
      <rect x="62" y="39" width="24" height="3" rx="1.5" fill="#94A3B8" />

      <rect x="42" y="55" width="44" height="3" rx="1.5" fill="#0066FF" opacity="0.6" />
      
      <circle cx="44" cy="65" r="1.5" fill="#0052FF" />
      <rect x="49" y="63.5" width="37" height="3" rx="1.5" fill="#CBD5E1" />
      
      <circle cx="44" cy="73" r="1.5" fill="#0052FF" />
      <rect x="49" y="71.5" width="33" height="3" rx="1.5" fill="#CBD5E1" />

      <circle cx="44" cy="81" r="1.5" fill="#0052FF" />
      <rect x="49" y="79.5" width="29" height="3" rx="1.5" fill="#CBD5E1" />
    </g>

    <!-- Orbiting Gradient Swoosh -->
    <path d="M 12 76 C 6 100, 68 112, 114 60 C 128 44, 118 22, 102 36 C 86 50, 22 94, 12 76 Z" fill="url(#swooshGrad)" opacity="0.9" />

    <!-- 4-Point Star Sparkle -->
    <path d="M 116 26 Q 116 18 124 18 Q 116 18 116 10 Q 116 18 108 18 Q 116 18 116 26 Z" fill="#00E5FF" />
  </g>

  <!-- TYPOGRAPHY GROUP -->
  <g transform="translate(145, 22)">
    <!-- Main Brand Name: Resume Builder -->
    <text x="0" y="50" font-family="'Outfit', 'Inter', 'Poppins', system-ui, -apple-system, sans-serif" font-size="48" font-weight="900" letter-spacing="-0.5">
      <tspan fill="#0F172A">Resume </tspan>
      <tspan fill="url(#builderTextGrad)">Builder</tspan>
    </text>

    <!-- Tagline: — BUILD YOUR FUTURE — -->
    <g transform="translate(0, 74)">
      <!-- Left Line -->
      <line x1="2" y1="-5" x2="45" y2="-5" stroke="#00B2FF" stroke-width="2.5" stroke-linecap="round" />

      <!-- Tagline Text -->
      <text x="56" y="0" font-family="'Outfit', 'Inter', 'Poppins', system-ui, -apple-system, sans-serif" font-size="16" font-weight="700" fill="#475569" letter-spacing="3.5">
        BUILD YOUR FUTURE
      </text>

      <!-- Right Line -->
      <line x1="285" y1="-5" x2="328" y2="-5" stroke="#00D2FF" stroke-width="2.5" stroke-linecap="round" />
    </g>
  </g>
</svg>
